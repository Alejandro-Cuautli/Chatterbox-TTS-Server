# Imágenes (CPU y GPU), estándar «CI de la fábrica» (ci/ESTANDAR-CI-FABRICA.md, regla 3).
#
# Las seis imágenes (cu130 arm64 ~67 min, rocm ~58 min, nvidia ~36 min...) YA NO se
# construyen en cada PR: corren en push a main/docker-release, en tags v*, en el nightly
# y a mano. En PR solo corre el smoke CPU de ci.yml (y solo si la PR toca Dockerfile,
# requirements o .github/). Este workflow no tiene disparador pull_request, así que no
# produce ningún check que bloquee una PR. Nunca se publica fuera de push/tags.
#
# Rollback: revert del merge (devuelve el build en cada PR).
name: Build and Push Docker Container

on:
  push:
    branches: [ main, docker-release ]
    tags: [ 'v*' ]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Por commit/tag; nunca se cancela un build de main o de un tag.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # NVIDIA CUDA 12.1
          - dockerfile: Dockerfile
            tag-suffix: nvidia
            platforms: linux/amd64
            build-args: RUNTIME=nvidia
            runner: [self-hosted, X64, synaptic-voice-studio]

          # NVIDIA CUDA 12.8 Blackwell
          - dockerfile: Dockerfile.cu128
            tag-suffix: cu128
            platforms: linux/amd64
            build-args: RUNTIME=nvidia
            runner: [self-hosted, X64, synaptic-voice-studio]

          # NVIDIA CUDA 13.0 Blackwell sm121 (ARM64)
          - dockerfile: Dockerfile.cu130
            tag-suffix: cu130
            platforms: linux/arm64
            build-args: RUNTIME=nvidia
            runner: [self-hosted, ARM64, synaptic-voice-studio]

          # AMD ROCm
          - dockerfile: Dockerfile.rocm
            tag-suffix: rocm
            platforms: linux/amd64
            build-args: ""
            runner: [self-hosted, X64, synaptic-voice-studio]

          # AMD Strix Halo ROCm
          - dockerfile: Dockerfile.strixhalo
            tag-suffix: strixhalo
            platforms: linux/amd64
            build-args: ""
            runner: [self-hosted, X64, synaptic-voice-studio]

          # CPU only
          - dockerfile: Dockerfile.cpu
            tag-suffix: cpu
            platforms: linux/amd64
            build-args: ""
            runner: [self-hosted, X64, synaptic-voice-studio]

    # Runners self-hosted nativos (amd64 en el build-farm de vps_05, ARM64 en vps_04):
    # sin fallback hospedado ni QEMU. Holgado para las GPU (~67 min la más lenta).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Solo se publica en push (rama o tag): nunca en schedule ni a mano.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.tag-suffix }}
            type=ref,event=pr,suffix=-${{ matrix.tag-suffix }}
            type=semver,pattern={{version}},suffix=-${{ matrix.tag-suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.tag-suffix }}
            type=sha,format=short,suffix=-${{ matrix.tag-suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.tag-suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag-suffix }}
