# Hermes CI — carril rápido de PR + carril pesado (estándar «CI de la fábrica»,
# synaptic-catalog ci/ESTANDAR-CI-FABRICA.md; piloto: incu-bot docs/ci/carriles.md).
#
# Es la segunda puerta de pruebas. Este repo es Python (servidor TTS con torch fijado):
# el carril rápido NO instala torch ni requirements.txt; hace ruff (errores de sintaxis
# y nombres sin definir) y compileall. No hay suite de tests; si aparece `tests/`, corre.
# Las imágenes GPU viven en docker-build.yml (solo main, tags, nightly y a mano).
#
#   - carril rápido (cada PR, presupuesto 5 min con la cola): lint, tests y build;
#   - carril pesado (imágenes): en docker-build.yml, solo main, tags, nightly y a mano.
# Ninguna compuerta se quita: el carril pesado cambia de momento, no desaparece.
#
# Disparadores: SOLO pull_request (+ push a main, nightly y a mano). El antiguo
# `push: branches-ignore: [main]` lanzaba un segundo run por cada push a una rama con
# PR, en otro grupo de `concurrency` (refs/heads/x ≠ refs/pull/N/merge), y los dos se
# peleaban por el único runner del repo.
#
# Nunca `paths:` a nivel de workflow: `ci-result` es un check requerido y un workflow
# filtrado no lo reporta (se queda Pending). El filtro es el job `changes`.
#
# Rollback: revert del merge. (HERMES_CI_FORCE_HEAVY=true fuerza `heavy`, hoy sin job en PR.)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pull-requests: read

# Una PR = un grupo: un push nuevo cancela el run viejo de esa PR. Main va por commit y
# no se cancela nunca (un grupo solo guarda un run pendiente: agrupar main por rama
# dejaría commits sin veredicto).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Qué cambia la PR. code=false solo si TODO son .md; heavy=true si toca de qué está
  # hecha la imagen o el propio CI. Fuera de una PR, todo.
  changes:
    runs-on: [self-hosted, ARM64, synaptic-voice-studio]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORCE_HEAVY: ${{ vars.HERMES_CI_FORCE_HEAVY }}
        run: |
          set -euo pipefail
          all() { printf 'code=true\nheavy=true\n' >> "$GITHUB_OUTPUT"; echo "$1: carril completo" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || all "${GITHUB_EVENT_NAME}"
          [ "${FORCE_HEAVY:-}" != "true" ] || all "HERMES_CI_FORCE_HEAVY=true"
          # Un rename deja la ruta vieja en previous_filename: se clasifican las dos.
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          # La API corta en 3000 ficheros: a partir de ahí no se adivina.
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then all "${count} ficheros"; fi
          code=false heavy=false
          while IFS= read -r f; do
            case "$f" in
              *.md) ;;
              *) code=true ;;
            esac
            case "$f" in
              *Dockerfile*|*.dockerignore|docker-compose*.yml|compose*.yml \
              |package.json|*/package.json|package-lock.json|*/package-lock.json|pnpm-lock.yaml|yarn.lock \
              |requirements*.txt|*/requirements*.txt|pyproject.toml|*/pyproject.toml|poetry.lock|uv.lock \
              |.nvmrc|.node-version|.python-version|.tool-versions|.github/*)
                [ "$heavy" = true ] || echo "carril pesado: $f"; heavy=true ;;
            esac
          done <<< "$files"
          printf 'code=%s\nheavy=%s\n' "$code" "$heavy" >> "$GITHUB_OUTPUT"
          echo "code=$code heavy=$heavy ($count ficheros)" | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, ARM64, synaptic-voice-studio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint (ruff) + compileall + tests si existen
        run: |
          set -euo pipefail
          PIP_CACHE_DIR="$(bash .github/ci/local-cache.sh dir pip)"
          export PIP_CACHE_DIR
          venv="$RUNNER_TEMP/venv-ci"
          python3 -m venv "$venv"
          . "$venv/bin/activate"
          pip install --quiet ruff
          # Solo errores reales (sintaxis, nombres sin definir): el árbol heredado del
          # upstream tiene cientos de avisos de estilo que no son de esta puerta.
          ruff check --no-cache --select E9,F63,F7,F82 .
          python -m compileall -q -x '(^|/)(\.git|\.venv[^/]*)(/|$)' .
          if [ -d tests ]; then
            pip install --quiet -r requirements.txt pytest
            pytest -q tests
          fi

  # Carril pesado: en este repo NO hay job de imagen en la PR. El build CPU instala torch
  # y compila onnx/tokenizers (>45 min en ARM64) y los Dockerfile GPU parten de bases
  # amd64 enormes; las seis imágenes se construyen y publican en docker-build.yml
  # (main, tags, nightly y a mano). `heavy` queda calculado por si se añade un carril.

  # Único check requerido de CI (con `contract`, .hermes/delivery.json). Un gate omitido
  # cuenta como fallo, salvo `test` cuando la PR solo trae .md.
  ci-result:
    if: always()
    needs: [changes, test]
    runs-on: [self-hosted, ARM64, synaptic-voice-studio]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every gate
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r --arg code "$CODE" '
            to_entries[] | .key as $k | .value.result as $r
            | select(($r == "failure" or $r == "cancelled")
                     or ($r == "skipped" and ($k == "changes"
                                              or ($k == "test" and $code == "true"))))
            | "\($k): \($r)"')
          if [ -n "$bad" ]; then
            echo "::error::gates not satisfied: $(echo $bad)"
            exit 1
          fi

      # Regla 1: 5 min desde que se crea el run, cola incluida. Avisa; no falla.
      - name: Fast-lane budget
        if: always() && github.event_name == 'pull_request' && needs.changes.outputs.heavy != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_SECONDS: ${{ vars.HERMES_CI_FAST_BUDGET_SECONDS || '300' }}
        run: |
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          elapsed=$(( $(date +%s) - $(date -d "$created" +%s) ))
          line="carril rápido: ${elapsed}s de ${BUDGET_SECONDS}s (cola incluida)"
          echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$BUDGET_SECONDS" ]; then
            echo "::warning::${line} — fuera de presupuesto: justifícalo en la PR u optimízalo"
          else
            echo "$line"
          fi
